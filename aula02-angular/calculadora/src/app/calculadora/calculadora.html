<div class="container">
    <form class="form-box">
        <h2>Calculadora Simples</h2>

        <label for="numero1">Número 1:</label>
        <input type="number" id="numreo1" [(ngModel)]="numero1" placeholder="Digite o primeiro número">

        <label for="numero2">Número 2:</label>
        <input type="number" id="numero2" [(ngModel)]="numero2" placeholder="Digite o segundo número">

        <button (click)="calcularResultado()">Somar</button>

        <div class="result-display">
            <p>Resultado: <span id="result">{{ resultado }}</span></p>
        </div>
    </form>
</div>
